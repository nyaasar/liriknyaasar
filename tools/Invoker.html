<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Invoice DMT Final Sejajar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
body{
	font-family:Arial;
	background:#f2f2f2;
	padding:10px
}

.wrap{
	max-width:600px;
	margin:auto;
	background:#fff;
	border-radius:12px;
	padding:14px
}

label{
	font-size:12px;
	font-weight:bold;
	display:block;
	margin-top:10px
}
labeldesc{
	font-size:8px;
	font-weight:lighter;
	display:block;
	margin-top:4px 0px 10px 4px;
}

input,
textarea{
	width:100%;
	box-sizing:border-box;
	padding:11px;
	border:1px solid #ddd;
	border-radius:8px;
	margin-top:4px
}

.grid2{
	display:grid;
	grid-template-columns:1fr 1fr;
	gap:8px
}

.item{
	background:#fafafa;
	border:1px solid #eee;
	border-radius:10px;
	padding:10px;
	margin-top:10px
}

.btn{
	padding:10px;
	border:none;
	border-radius:10px;
	font-weight:bold;
	cursor:pointer
}

.btnAdd{
	background:#111;
	color:#fff;
	width:100%;
	margin-top:10px
}

.btnDel{
	background:#ffebee;
	color:#d32f2f
}

.btnPreview{
	background:#455a64;
	color:#fff;
	width:100%;
	padding:14px;
	font-size:15px;
	margin-top:14px
}

.btnPDF{
	background:#2962ff;
	color:#fff;
	width:100%;
	padding:16px;
	font-size:16px;
	margin-top:8px
}

.small{
	font-size:11px;
	color:#888;
	text-align:center;
	margin-top:6px
}

.previewWrap{
	margin-top:12px;
	border:1px solid #ddd;
	border-radius:10px;
	overflow:hidden;
	background:#f5f5f5
}

.previewTitle{
	font-size:12px;
	font-weight:bold;
	color:#666;
	padding:8px 10px;
	background:#fafafa;
	border-bottom:1px solid #ddd
}

#pdfPreview{
	display:none;
	width:100%;
	height:520px;
	border:0;
	background:#fff
}

.previewEmpty{
	height:120px;
	display:flex;
	align-items:center;
	justify-content:center;
	text-align:center;
	color:#999;
	font-size:12px;
	padding:20px;
	box-sizing:border-box
}

.uploadPreview{
	max-width:220px;
	max-height:100px;
	display:none;
	margin-top:6px;
	border:1px dashed #ccc;
	padding:4px;
	border-radius:6px;
	object-fit:contain
}

.stampPreview{
	max-width:180px;
	max-height:90px;
	display:none;
	margin-top:6px;
	border:1px dashed #ccc;
	padding:4px;
	border-radius:6px;
	object-fit:contain
}
</style>
</head>

<body>

<div class="wrap">

	<h2 style="text-align:center">🧾 Invoice DMT</h2>


	<!-- =========================
	     LOGO
	========================= -->

	<label>Upload Logo PNG</label>
    <labeldesc>Supported fromats are PNG, WebP, & SVG.</labeldesc>

	<input
		type="file"
		id="logoInput"
		accept="image/png,image/webp,image/svg+xml"
	>

	<img
		id="logoPrev"
		class="uploadPreview"
	>


	<!-- =========================
	     DIGITAL STAMP
	========================= -->

	<label>Upload Digital Stamp PNG</label>
    <labeldesc>Supported fromats are PNG, WebP, & SVG.</labeldesc>

	<input
		type="file"
		id="stampInput"
		accept="image/png,image/webp,image/svg+xml"
	>

	<img
		id="stampPrev"
		class="stampPreview"
	>


	<!-- =========================
	     INVOICE INFO
	========================= -->

	<div class="grid2">

		<div>
			<label>Invoice No</label>

			<input
				id="invNo"
				value="INS/DMT929"
			>
		</div>

		<div>
			<label>Create Date</label>

			<input
				id="creatDate"
				type="date"
			>
		</div>

	</div>


	<div class="grid2">

		<div>
			<label>Due Date</label>

			<input
				id="dueDate"
				type="date"
			>
		</div>

		<div>
			<label>Pembayaran</label>

			<input
				id="payMethod"
				value="CASH / TF BCA 0181714947 a/n ARISTIG FARANDY K."
			>
		</div>

	</div>


	<!-- =========================
	     BILL TO
	========================= -->

	<label>BILL TO</label>

	<input
		id="billName"
		value="Pak Nandar"
	>

	<textarea id="billAddr">Villa Jasmine 3 blok B6/01, Kec.Suko</textarea>

	<input
		id="billPhone"
		value="+6281357596317"
	>


	<!-- =========================
	     ITEMS
	========================= -->

	<div id="items"></div>

	<button
		class="btn btnAdd"
		type="button"
		id="btnAdd"
	>
		+ Tambah Item
	</button>


	<!-- =========================
	     TERMS
	========================= -->

	<label>Terms</label>

	<textarea id="terms" rows="5">*Garansi 6 bulan meliputi unit Wifi kamera Ezviz H6C
*Garansi batal jika rusak akibat kesalahan pemakaian, bencana alam dan segel rusak
*Proses klaim garansi melalui pemeriksaan Teknisi Vendor</textarea>


	<!-- =========================
	     PDF BUTTONS
	========================= -->

	<button
		class="btn btnPreview"
		type="button"
		id="btnPreview"
	>
		👁️ Preview PDF
	</button>

	<button
		class="btn btnPDF"
		type="button"
		id="btnPDF"
	>
		📄 Generate PDF
	</button>


	<!-- =========================
	     PDF PREVIEW
	========================= -->

	<div class="previewWrap">

		<div class="previewTitle">
			PDF Preview
		</div>

		<div
			id="previewEmpty"
			class="previewEmpty"
		>
			Tekan <b>Preview PDF</b> untuk melihat invoice sebelum mengunduhnya.
		</div>

		<iframe id="pdfPreview"></iframe>

	</div>


	<div
		class="small"
		id="saveInfo"
	>
		Auto-save aktif
	</div>

</div>


<script>

const KEY='dmt_final_sejajar_v6';

let logoDataUrl=null;

let stampDataUrl=null;


/*
 * Stamp rotation is stored so the same invoice
 * keeps the same stamp angle between Preview
 * and Generate PDF.
 */
let stampRotation=null;


let items=[
	{
		desc:'EZVIZ H6C 3MP',
		qty:2,
		price:330000
	},
	{
		desc:'MicroSD 64GB',
		qty:2,
		price:80000
	}
];


let previewUrl=null;


/* =========================
   AUTO SAVE
========================= */

function saveAll(){

	let data={
		invNo:invNo.value,
		creatDate:creatDate.value,
		dueDate:dueDate.value,
		payMethod:payMethod.value,
		billName:billName.value,
		billAddr:billAddr.value,
		billPhone:billPhone.value,
		terms:terms.value,
		items:items,
		logo:logoDataUrl,
		stamp:stampDataUrl,
		stampRotation:stampRotation
	};

	try{

		localStorage.setItem(
			KEY,
			JSON.stringify(data)
		);

		saveInfo.textContent=
			'Tersimpan '+
			new Date().toLocaleTimeString();

	}catch(e){}

}


/* =========================
   LOAD SAVED DATA
========================= */

function loadAll(){

	let raw=
		localStorage.getItem(KEY);

	if(!raw)return;

	try{

		let d=
			JSON.parse(raw);


		invNo.value=
			d.invNo||invNo.value;


		creatDate.value=
			d.creatDate||creatDate.value;


		dueDate.value=
			d.dueDate||dueDate.value;


		payMethod.value=
			d.payMethod||payMethod.value;


		billName.value=
			d.billName||billName.value;


		billAddr.value=
			d.billAddr||billAddr.value;


		billPhone.value=
			d.billPhone||billPhone.value;


		terms.value=
			d.terms||terms.value;


		if(d.items)
			items=d.items;


		/* LOAD LOGO */

		if(d.logo){

			logoDataUrl=
				d.logo;

			logoPrev.src=
				logoDataUrl;

			logoPrev.style.display=
				'block';

		}


		/* LOAD STAMP */

		if(d.stamp){

			stampDataUrl=
				d.stamp;

			stampPrev.src=
				stampDataUrl;

			stampPrev.style.display=
				'block';

		}


		/* LOAD STAMP ROTATION */

		if(
			typeof d.stampRotation===
			'number'
		){

			stampRotation=
				d.stampRotation;

		}


	}catch(e){}

}


/* =========================
   DEFAULT DATES
========================= */

if(!creatDate.value){

	creatDate.valueAsDate=
		new Date();

}


if(!dueDate.value){

	let d=
		new Date();

	d.setDate(
		d.getDate()+1
	);

	dueDate.valueAsDate=d;

}


/* =========================
   LOGO UPLOAD
========================= */

logoInput.addEventListener(
	'change',
	e=>{

		let f=
			e.target.files[0];

		if(!f)return;


		let r=
			new FileReader();


		r.onload=
			ev=>{

				logoDataUrl=
					ev.target.result;

				logoPrev.src=
					logoDataUrl;

				logoPrev.style.display=
					'block';

				saveAll();

			};


		r.readAsDataURL(f);

	}
);


/* =========================
   DIGITAL STAMP UPLOAD
========================= */

stampInput.addEventListener(
	'change',
	e=>{

		let f=
			e.target.files[0];

		if(!f)return;


		let r=
			new FileReader();


		r.onload=
			ev=>{

				stampDataUrl=
					ev.target.result;


				/*
				 * Generate a subtle random tilt.
				 *
				 * Range:
				 * -6° to +6°
				 */
				stampRotation=
					Math.round(
						(
							Math.random()*12-6
						)*10
					)/10;


				stampPrev.src=
					stampDataUrl;

				stampPrev.style.display=
					'block';


				saveAll();

			};


		r.readAsDataURL(f);

	}
);


/* =========================
   RENDER ITEMS
========================= */

function renderItems(){

	let cont=
		document.getElementById('items');

	cont.innerHTML='';


	items.forEach(
		(it,i)=>{

			let div=
				document.createElement('div');

			div.className='item';


			div.innerHTML=`

				<div style="display:flex;justify-content:space-between">

					<b>Item ${i+1}</b>

					<button
						class="btn btnDel"
						type="button"
						data-del="${i}"
					>
						Hapus
					</button>

				</div>


				<label>Deskripsi</label>

				<input
					data-i="${i}"
					data-k="desc"
					value="${it.desc.replace(/"/g,'&quot;')}"
				>


				<div class="grid2">

					<div>

						<label>QTY</label>

						<input
							type="number"
							data-i="${i}"
							data-k="qty"
							value="${it.qty}"
						>

					</div>


					<div>

						<label>Harga</label>

						<input
							type="number"
							data-i="${i}"
							data-k="price"
							value="${it.price}"
						>

					</div>

				</div>

			`;


			cont.appendChild(div);

		}
	);


	cont.querySelectorAll('input')
		.forEach(
			inp=>{

				inp.addEventListener(
					'input',
					e=>{

						let i=
							parseInt(
								e.target.dataset.i
							);

						let k=
							e.target.dataset.k;

						let v=
							e.target.value;


						if(k!=='desc')
							v=
								parseFloat(v)||0;


						items[i][k]=v;

						saveAll();

					}
				);

			}
		);


	cont.querySelectorAll('[data-del]')
		.forEach(
			b=>{

				b.addEventListener(
					'click',
					e=>{

						items.splice(
							parseInt(
								e.target.dataset.del
							),
							1
						);


						renderItems();

						saveAll();

					}
				);

			}
		);

}


/* =========================
   ADD ITEM
========================= */

document
	.getElementById('btnAdd')
	.addEventListener(
		'click',
		()=>{

			items.push({
				desc:'',
				qty:1,
				price:0
			});


			renderItems();

			saveAll();

		}
	);


/* =========================
   DATE FORMAT
========================= */

function formatTgl(iso){

	if(!iso)return'-';


	let d=
		new Date(iso);


	return String(
		d.getDate()
	).padStart(2,'0')
	+'/'+
	String(
		d.getMonth()+1
	).padStart(2,'0')
	+'/'+
	d.getFullYear();

}


/* =========================
   CREATE PDF
========================= */

function createPDF(){

	const {jsPDF}=
		window.jspdf;


	const doc=
		new jsPDF({
			unit:'pt',
			format:'a4'
		});


	const W=
		doc.internal.pageSize.getWidth();


	/* =========================
	   LOGO
	========================= */

	if(logoDataUrl){

		try{

			doc.addImage(
				logoDataUrl,
				'PNG',
				30,
				12,
				190,
				58
			);

		}catch(e){

			try{

				doc.addImage(
					logoDataUrl,
					'JPEG',
					30,
					12,
					190,
					58
				);

			}catch(e2){}

		}

	}


	/* =========================
	   INVOICE INFO
	========================= */

	doc.setFontSize(9);


	doc.text(
		'INVOICE NO.: '+invNo.value,
		W-180,
		32
	);


	doc.text(
		'CRE. DATE: '+formatTgl(creatDate.value),
		W-180,
		46
	);


	doc.text(
		'DUE DATE: '+formatTgl(dueDate.value),
		W-180,
		60
	);


	/* =========================
	   FROM
	========================= */

	doc.setFont(
		'helvetica',
		'bold'
	);


	doc.text(
		'FROM:',
		32,
		95
	);


	doc.setFont(
		'helvetica',
		'normal'
	);


	let fy=110;


	[
		'Delta Multi Teknik - CCTV, Networking & Air Conditioner Solution',
		'Jl. Wortel No.7 Tanggulangin, Sidoarjo',
		'0857-0260-7096',
		'admin@deltamulticctv.com'
	].forEach(
		l=>{

			doc.text(
				l,
				32,
				fy
			);

			fy+=12;

		}
	);


	/* =========================
	   BILL TO
	========================= */

	doc.setFont(
		'helvetica',
		'bold'
	);


	doc.text(
		'BILL TO:',
		W-180,
		95
	);


	doc.setFont(
		'helvetica',
		'normal'
	);


	let by=110;


	doc.text(
		billName.value,
		W-180,
		by
	);


	by+=12;


	let addr=
		doc.splitTextToSize(
			billAddr.value,
			160
		);


	doc.text(
		addr,
		W-180,
		by
	);


	by+=
		addr.length*12;


	doc.text(
		billPhone.value,
		W-180,
		by
	);


	/* =========================
	   TABLE DATA
	========================= */

	let body=
		items
		.filter(
			it=>it.desc
		)
		.map(
			it=>[
				it.desc,
				it.qty.toString(),
				it.price.toLocaleString('id-ID'),
				'Rp.'+
				(
					it.qty*it.price
				).toLocaleString('id-ID')
			]
		);


	let total=
		items.reduce(
			(s,it)=>
				s+
				it.qty*it.price,
			0
		);


	/* =========================
	   TABLE
	   NO INTERNAL LINES
	========================= */

	const tableStartY=155;


	doc.autoTable({

		startY:tableStartY,


		head:[
			[
				'DESCRIPTION',
				'QTY',
				'PRICE',
				'AMOUNT'
			]
		],


		body:body,


		foot:[
			[
				'',
				'',
				'TOTAL',
				'Rp.'+
				total.toLocaleString('id-ID')
			]
		],


		theme:'plain',


		styles:{
			fontSize:9,
			cellPadding:3,
			lineWidth:0
		},


		headStyles:{
			fontStyle:'bold',
			lineWidth:0
		},


		bodyStyles:{
			lineWidth:0
		},


		footStyles:{
			fontStyle:'bold',
			lineWidth:0
		},


		margin:{
			left:30,
			right:30
		}

	});


	/* =========================
	   TABLE BORDER
	========================= */

	const table=
		doc.lastAutoTable;


	const tableX=
		table.settings.margin.left;


	const tableY=
		tableStartY;


	const tableWidth=
		doc.internal.pageSize.getWidth()
		-
		table.settings.margin.left
		-
		table.settings.margin.right;


	const tableHeight=
		table.finalY-
		tableY;


	doc.setDrawColor(
		0,
		0,
		0
	);


	doc.setLineWidth(
		0.5
	);


	/* OUTER BORDER */

	doc.rect(
		tableX,
		tableY,
		tableWidth,
		tableHeight
	);


	/* HEADER DIVIDER */

	if(
		table.head &&
		table.head.length &&
		table.head[0].height
	){

		const headerBottom=
			tableY+
			table.head[0].height;


		doc.line(
			tableX,
			headerBottom,
			tableX+
			tableWidth,
			headerBottom
		);

	}


	/* =========================
	   PAYMENT METHOD
	========================= */

	let after=
		table.finalY+
		15;


	doc.setFont(
		'helvetica',
		'bold'
	);


	doc.text(
		'PAYMENT METHOD',
		32,
		after
	);


	after+=12;


	doc.setFont(
		'helvetica',
		'normal'
	);


	doc.setFontSize(9);


	doc.text(
		doc.splitTextToSize(
			payMethod.value,
			300
		),
		32,
		after
	);


	after+=28;


	/* =========================
	   TERMS
	========================= */

	let rawTerms=
		terms.value;


	let lines=
		rawTerms.split('\n');


	let finalTerms=[];


	lines.forEach(
		line=>{

			if(
				line.trim()===''
			){

				finalTerms.push('');

			}else{

				finalTerms=
					finalTerms.concat(
						doc.splitTextToSize(
							line,
							280
						)
					);

			}

		}
	);


	let termsY=
		after;


	let signY=
		after;


	/* =========================
	   TERMS LEFT
	========================= */

	doc.setFont(
		'helvetica',
		'bold'
	);


	doc.setFontSize(9);


	doc.setTextColor(
		0,
		0,
		0
	);


	doc.text(
		'TERMS & CONDITIONS',
		32,
		termsY
	);


	doc.setFont(
		'helvetica',
		'normal'
	);


	doc.setFontSize(7.5);


	doc.text(
		finalTerms,
		32,
		termsY+12
	);


	/* =========================
	   DIGITAL STAMP
	========================= */

	if(stampDataUrl){

		try{

			/*
			 * Stamp dimensions.
			 *
			 * 90 x 42 pt gives it a
			 * realistic signature/stamp
			 * size without dominating
			 * the invoice.
			 */

			const stampW=90;
			const stampH=42;


			/*
			 * Center the stamp over
			 * "Hormat Kami".
			 */

			const stampX=
				W-130-
				(stampW/2);


			/*
			 * Put the stamp above
			 * "Hormat Kami".
			 */

			const stampY=
				signY-
				50;


			/*
			 * Use the stored rotation.
			 *
			 * If an older saved invoice
			 * does not have one, create
			 * a subtle random angle.
			 */

			if(
				typeof stampRotation!=='number'
			){

				stampRotation=
					Math.round(
						(
							Math.random()*12-6
						)*10
					)/10;

				saveAll();

			}


			/*
			 * Try PNG first.
			 */

			try{

				doc.addImage(
					stampDataUrl,
					'PNG',
					stampX,
					stampY,
					stampW,
					stampH,
					undefined,
					'FAST',
					stampRotation
				);

			}catch(e){

				/*
				 * Fall back to JPEG.
				 */

				doc.addImage(
					stampDataUrl,
					'JPEG',
					stampX,
					stampY,
					stampW,
					stampH,
					undefined,
					'FAST',
					stampRotation
				);

			}

		}catch(e){

			console.error(
				'Stamp Error:',
				e
			);

		}

	}


	/* =========================
	   SIGNATURE TEXT
	========================= */

	doc.setFont(
		'helvetica',
		'normal'
	);


	doc.setFontSize(9);


	doc.text(
		'Hormat Kami,',
		W-130,
		signY,
		{
			align:'center'
		}
	);


	doc.setFont(
		'helvetica',
		'bold'
	);


	doc.setFontSize(8);


	doc.setTextColor(
		0,
		0,
		150
	);


	doc.text(
		'DELTA MULTI TEKNIK',
		W-130,
		signY+20,
		{
			align:'center'
		}
	);


	doc.text(
		'SIDOARJO',
		W-130,
		signY+32,
		{
			align:'center'
		}
	);


	doc.setTextColor(
		0,
		0,
		0
	);


	return doc;

}


/* =========================
   PREVIEW PDF
========================= */

document
	.getElementById('btnPreview')
	.addEventListener(
		'click',
		()=>{

			try{

				const doc=
					createPDF();


				if(previewUrl){

					URL.revokeObjectURL(
						previewUrl
					);

				}


				const pdfBlob=
					doc.output('blob');


				previewUrl=
					URL.createObjectURL(
						pdfBlob
					);


				const preview=
					document.getElementById(
						'pdfPreview'
					);


				const empty=
					document.getElementById(
						'previewEmpty'
					);


				preview.src=
					previewUrl;


				preview.style.display=
					'block';


				empty.style.display=
					'none';

			}catch(error){

				console.error(
					'PDF Preview Error:',
					error
				);


				alert(
					'Gagal membuat PDF preview. Silakan cek console browser untuk detail error.'
				);

			}

		}
	);


/* =========================
   GENERATE / DOWNLOAD PDF
========================= */

document
	.getElementById('btnPDF')
	.addEventListener(
		'click',
		()=>{

			try{

				const doc=
					createPDF();


				doc.save(
					'Invoice-'+
					invNo.value+
					'.pdf'
				);

			}catch(error){

				console.error(
					'PDF Generate Error:',
					error
				);


				alert(
					'Gagal membuat PDF. Silakan cek console browser untuk detail error.'
				);

			}

		}
	);


/* =========================
   INITIALIZE
========================= */

loadAll();

renderItems();


[
	'invNo',
	'creatDate',
	'dueDate',
	'payMethod',
	'billName',
	'billAddr',
	'billPhone',
	'terms'
].forEach(
	id=>{

		document
			.getElementById(id)
			.addEventListener(
				'input',
				saveAll
			);

	}
);


/* =========================
   CLEAN PREVIEW URL
========================= */

window.addEventListener(
	'beforeunload',
	()=>{

		if(previewUrl){

			URL.revokeObjectURL(
				previewUrl
			);

		}

	}
);

</script>
